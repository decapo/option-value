<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Option Value app icon: an option's value curve (green) riding above its
       expiry payoff "hockey stick" (dashed), with a dot marking the scenario. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22345c"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <!-- Grid -->
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="4">
      <line x1="100" y1="300" x2="924" y2="300"/>
      <line x1="100" y1="450" x2="924" y2="450"/>
      <line x1="100" y1="600" x2="924" y2="600"/>
      <line x1="100" y1="750" x2="924" y2="750"/>
    </g>

    <!-- Area under the value curve -->
    <path d="M60,694 C300,690 450,650 560,560 S720,410 810,340 L810,924 L60,924 Z" fill="url(#area)"/>

    <!-- Payoff at expiry: flat until the strike, then rising -->
    <path d="M60,700 L520,700 L810,372" fill="none" stroke="#ffffff" stroke-opacity="0.5"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30 26"/>

    <!-- Option value curve, with a soft glow -->
    <path d="M60,694 C300,690 450,650 560,560 S720,410 810,340" fill="none" stroke="#4ade80"
          stroke-opacity="0.6" stroke-width="40" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M60,694 C300,690 450,650 560,560 S720,410 810,340" fill="none" stroke="url(#curve)"
          stroke-width="34" stroke-linecap="round"/>

    <!-- Scenario point -->
    <circle cx="810" cy="340" r="44" fill="#4ade80" fill-opacity="0.25"/>
    <circle cx="810" cy="340" r="27" fill="#ffffff"/>
    <circle cx="810" cy="340" r="27" fill="none" stroke="#4ade80" stroke-width="10"/>
  </g>

  <!-- Faint rim highlight -->
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
</svg>
